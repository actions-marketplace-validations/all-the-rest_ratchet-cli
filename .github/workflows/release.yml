name: Release

# The release is a tag: the version lives in one place — Cargo.toml — and the
# tag is checked against it.  A tag that does not match the manifest fails
# the release instead of publishing a binary that calls itself something else.
on:
  push:
    tags: ["v*"]

# Only the job that publishes the release writes; every other job reads.
permissions:
  contents: read

jobs:
  verify:
    name: The gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check the formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test
        env:
          # The tests do not need the network: the update check is disabled,
          # and the release CI does not depend on the release API.
          RATCHET_NO_UPDATE_CHECK: "1"

      - name: "Self-gate: ratchet check"
        # The repository gates itself with the binary it ships.
        run: |
          cargo build
          ./target/debug/ratchet check
        env:
          # The gate does not wait for the network.
          RATCHET_NO_UPDATE_CHECK: "1"

  version:
    name: The version of the release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read the version from the manifest
        id: version
        run: |
          # The version lives in one place — the manifest — and is checked
          # against the tag.  A version that is written in two places drifts;
          # a version that is written in one place and checked against the
          # other does not.
          version="$(awk '
            /^[[:space:]]*\[/ { section = $0; next }
            section == "[package]" && /^[[:space:]]*version[[:space:]]*=/ {
              line = $0
              sub(/^[^=]*=[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::the version cannot be read from Cargo.toml"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the version $version of Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: x86_64
            asset_exe: ""
            asset_compression: tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: aarch64
            asset_exe: ""
            asset_compression: tar.gz
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset_os: macos
            asset_arch: x86_64
            asset_exe: ""
            asset_compression: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_os: macos
            asset_arch: aarch64
            asset_exe: ""
            asset_compression: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: x86_64
            asset_exe: ".exe"
            asset_compression: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the cross compiler
        # The linux aarch64 binary is built on an x86_64 runner: the TLS
        # stack needs a C compiler for the target.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build the binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RATCHET_NO_UPDATE_CHECK: "1"

      - name: Pack the assets
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OS: ${{ matrix.asset_os }}
          ARCH: ${{ matrix.asset_arch }}
          EXE: ${{ matrix.asset_exe }}
          COMPRESSION: ${{ matrix.asset_compression }}
          # The asset names are defined once — in the binary, in the module
          # `update` — and mirrored here.  The test compares the two, so the
          # self-update can never look for an asset the release does not
          # produce.
          ASSET_TEMPLATE: 'ratchet-{version}-{os}-{arch}{exe}'
          ARCHIVE_TEMPLATE: 'ratchet-{version}-{os}-{arch}.{compression}'
        run: |
          asset="$ASSET_TEMPLATE"
          asset="${asset//\{version\}/$VERSION}"
          asset="${asset//\{os\}/$OS}"
          asset="${asset//\{arch\}/$ARCH}"
          asset="${asset//\{exe\}/$EXE}"
          archive="$ARCHIVE_TEMPLATE"
          archive="${archive//\{version\}/$VERSION}"
          archive="${archive//\{os\}/$OS}"
          archive="${archive//\{arch\}/$ARCH}"
          archive="${archive//\{compression\}/$COMPRESSION}"

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ratchet$EXE" "dist/$asset"
          if [ "$COMPRESSION" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'target/${{ matrix.target }}/release/ratchet.exe' -DestinationPath 'dist/$archive'"
          else
            tar -czf "dist/$archive" -C "target/${{ matrix.target }}/release" "ratchet$EXE"
          fi
          ls -l dist

      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: ratchet-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: The checksums of the assets
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download the assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ratchet-*
          merge-multiple: true

      - name: Write the checksums
        run: |
          cd dist
          sha256sum $(ls | sort) > checksums.txt
          cat checksums.txt

      - name: Upload the checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, checksums]
    runs-on: ubuntu-latest
    # The release is written: this job and this job alone needs the write.
    permissions:
      contents: write
    steps:
      - name: Download the assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ratchet-*
          merge-multiple: true

      - name: Download the checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
