name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        # The JavaScript config is evaluated by node; without it the eight
        # node-gated tests would skip silently.
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test

      - name: "Self-gate: ratchet check"
        # The repository gates itself with the binary it ships: the rules are
        # in ratchet.config.jsonc, the counters in scripts/count.sh, the
        # baselines in ratchet.baseline.json.  The binary has to exist before
        # the gate runs.
        run: |
          cargo build
          ./target/debug/ratchet check
